; smoke_fast_min.cfg
; Harness-only template for fast, non-empty runner smoke tests.

Throat.Profile      = 1
Throat.Diameter     = 25.4
Throat.Angle        = 7
Coverage.Angle      = 45
Length              = 60

; OS-SE termination (simple starter)
Term.s              = 0.5
Term.n              = 4.0
Term.q              = 0.996
OS.k                = 1

; no morphing
Morph.TargetShape   = 0

; low-res mesh/grid for quick harness runs
Mesh.AngularSegments = 32
Mesh.LengthSegments  = 10
Mesh.ThroatResolution = 8
Mesh.MouthResolution  = 12

; ABEC project + quick simulation window
Output.ABECProject  = 1
ABEC.SimType        = 1
ABEC.f1             = 1000
ABEC.f2             = 8000
ABEC.NumFrequencies = 10
ABEC.Abscissa       = 1
ABEC.MeshFrequency  = 1000

; Polars (small but non-trivial)
ABEC.Polars:SPL = {
MapAngleRange = 0,90,19
NormAngle = 20
Distance = 3
Offset = 65
}
